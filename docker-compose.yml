services:
  # ================================
  # Frontend Application
  # ================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3010/api}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Frontend Template}
    container_name: frontend_template_app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${PORT:-3011}:3011"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3011"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - web_network

networks:
  web_network:
    external: true
